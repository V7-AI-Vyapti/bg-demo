name: Blue Green Deploy

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: Project slug to deploy
        required: true
        type: string
      generation_id:
        description: Generation id for this deploy
        required: true
        type: string
      branch:
        description: Branch to deploy
        required: false
        default: main
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.TAG }}
      repo_lower: ${{ steps.repo.outputs.REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set lowercase repo
        id: repo
        run: echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate tag
        id: vars
        run: echo "TAG=${{ inputs.branch }}-${{ inputs.generation_id }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Clone project repo
        run: |
          git clone --branch "${{ inputs.branch }}" \
            "https://github.com/${{ github.repository_owner }}/${{ inputs.project_slug }}.git" \
            ./project

      - name: Build & Push platform image
        run: |
          docker buildx build \
            --cache-from=type=gha,scope=platform \
            --cache-to=type=gha,mode=max,scope=platform \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/platform:${{ steps.vars.outputs.TAG }} \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/platform:latest \
            --push \
            ./project

      - name: Build & Push background-worker image
        run: |
          docker buildx build \
            --cache-from=type=gha,scope=worker \
            --cache-to=type=gha,mode=max,scope=worker \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/background-worker:${{ steps.vars.outputs.TAG }} \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/background-worker:latest \
            --push \
            ./project

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          source: ".github/scripts/*"
          target: "/tmp/v7ai-scripts"
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            export PATH="/home/v7aisolution/.nvm/versions/node/v24.14.0/bin:$PATH"

            SCRIPTS="/tmp/v7ai-scripts"
            chmod +x "$SCRIPTS"/*.sh

            PROJECT_SLUG="${{ inputs.project_slug }}"
            GENERATION_ID="${{ inputs.generation_id }}"
            BRANCH="${{ inputs.branch }}"
            IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
            REPO="${{ needs.build.outputs.repo_lower }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Project    : $PROJECT_SLUG"
            echo "  Generation : $GENERATION_ID"
            echo "  Branch     : $BRANCH"
            echo "  Image tag  : $IMAGE_TAG"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            "$SCRIPTS/blue-green-swap.sh" \
              "$PROJECT_SLUG" \
              "$REPO" \
              "$IMAGE_TAG"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Deploy complete!"
            echo "  Project : $PROJECT_SLUG"
            echo "  Tag     : $IMAGE_TAG"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"