name: Project Deploy
on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: Project slug to deploy
        required: true
        type: string
      generation_id:
        description: Generation id for this deploy
        required: true
        type: string
      branch:
        description: Branch to deploy
        required: false
        default: main
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          echo "Host set? ${{ secrets.VM_HOST != '' }}"
          echo "Key set? ${{ secrets.SSH_PRIVATE_KEY != '' }}"
          echo "User: ${{ vars.SSH_USER }}"
          echo "Port: ${{ vars.SSH_PORT }}"

      - name: Copy scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          source: ".github/scripts/*"
          target: "/tmp/v7ai-scripts"
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            export PATH="/home/v7aisolution/.nvm/versions/node/v24.14.0/bin:$PATH"

            SCRIPTS="/tmp/v7ai-scripts"
            chmod +x "$SCRIPTS"/*.sh

            PROJECT_SLUG="${{ inputs.project_slug }}"
            GENERATION_ID="${{ inputs.generation_id }}"
            BRANCH="${{ inputs.branch }}"

            if [ -z "${PROJECT_SLUG}" ]; then
              echo "Missing required workflow input: project_slug"
              exit 1
            fi

            DEPLOY_DIR="/home/deploy/vyapti/generated-projects/${PROJECT_SLUG}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Project    : $PROJECT_SLUG"
            echo "  Generation : $GENERATION_ID"
            echo "  Branch     : $BRANCH"
            echo "  Dir        : $DEPLOY_DIR"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ── Prepare: clone/pull + assign all ports → writes .env.ports ──
            APP_PORT=$("$SCRIPTS/prepare-deploy.sh" \
              "$PROJECT_SLUG" \
              "$DEPLOY_DIR" \
              "${{ github.repository_owner }}" \
              "$SCRIPTS" \
              "$BRANCH")
            echo "[prepare] App port: $APP_PORT"

            # ── Docker ──────────────────────────────────────────────────
            cd "$DEPLOY_DIR"
            docker compose \
              --env-file "$DEPLOY_DIR/.env.ports" \
              up -d --build
            echo "[docker] Containers are up"

            # ── Nginx ───────────────────────────────────────────────────
            "$SCRIPTS/setup-nginx.sh" "$PROJECT_SLUG" "$APP_PORT"

            # ── Health check ─────────────────────────────────────────────
            echo "[health] Waiting 30s for services to initialise..."
            sleep 30
            "$SCRIPTS/health-check.sh" "$APP_PORT"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Deploy complete!"
            echo "  Branch : $BRANCH"
            echo "  URL    : http://${PROJECT_SLUG}.v7ai.org"
            echo "  Port   : $APP_PORT"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"