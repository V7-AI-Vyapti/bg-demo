# Standalone compose file for GitHub-hosted project repositories.
x-generated-app-build: &generated-app-build
  context: .
  dockerfile: Dockerfile

x-generated-app-env: &generated-app-env
  NODE_ENV: "development"
  PORT: "3000"
  API_PREFIX: "api"
  APP_NAME: "BG Demo"
  DB_TYPE: postgres
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
  DB_DATABASE: "bg_demo"
  DB_SYNCHRONIZE: "true"
  DB_LOGGING: "true"
  QUEUE_REDIS_HOST: "redis"
  QUEUE_REDIS_PORT: "6379"
  QUEUE_REDIS_DB: "0"
  AWS_S3_ENDPOINT: "http://minio:9000"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  AWS_REGION: "us-east-1"
  FILE_MANAGEMENT_BUCKET_NAME: "vyapti-be"
  FILE_STORAGE_PUBLIC_BASE_URL: "http://127.0.0.1:${PORT_minio_9000:-9100}/vyapti-be"
  VYAPTI_REPO_ROOT: "/app"

x-generated-app-depends-on: &generated-app-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  platform:
    build: *generated-app-build
    container_name: bg-demo-platform
    ports:
      - "${PORT_platform_3000:-3000}:3000"
    env_file:
      - .env
    environment: *generated-app-env
    depends_on: *generated-app-depends-on
    volumes:
      - ./tmp:/app/tmp
    restart: unless-stopped

  background-worker:
    build: *generated-app-build
    container_name: bg-demo-background-worker
    env_file:
      - .env
    environment:
      <<: *generated-app-env
      GENERATED_PROJECT_RUN_FIXTURES: "false"
    depends_on: *generated-app-depends-on
    volumes:
      - ./tmp:/app/tmp
    command: ["pnpm", "run", "worker:prod"]
    restart: unless-stopped

  postgres:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "bg_demo"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d bg_demo",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: "redis:7-alpine"
    container_name: bg-demo-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    image: "minio/minio:latest"
    container_name: bg-demo-minio
    ports:
      - "${PORT_minio_9000:-9000}:9000"
      - "${PORT_minio_9001:-9001}:9001"
    volumes:cat /home/deploy/vyapti/generated-projects/bg-demo/.env | grep -E "DB_HOST|DB_PORT"
DB_HOST=localhost
DB_PORT=5433
