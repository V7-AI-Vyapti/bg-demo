      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  minio-init:
    image: "minio/mc:latest"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for i in $$(seq 1 30); do
          if mc alias set local http://minio:9000 minioadmin minioadmin; then
            mc ls local/vyapti-be >/dev/null 2>&1 || mc mb local/vyapti-be
            exit 0
          fi
          sleep 1
        done
        echo "MinIO alias or bucket setup failed after minio was healthy" >&2
        exit 1
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data: